server {
    listen 8080;

    location /api/auth/ {
        proxy_pass http://auth-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/products {
        proxy_pass http://product-service:5000;
        proxy_set_header Host $host;
    }

    location /api/products/ {
        proxy_pass http://product-service:5000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}