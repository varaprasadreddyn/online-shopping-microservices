apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: online-shopping
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend-container
          image: online-shopping-frontend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          volumeMounts:
            - name: frontend-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: frontend.conf

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

      volumes:
        - name: frontend-config
          configMap:
            name: shopping-config
            items:
              - key: frontend.conf
                path: frontend.conf

---
apiVersion: v1
kind: Service
metadata:
  name: shopping-frontend
  namespace: online-shopping
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort