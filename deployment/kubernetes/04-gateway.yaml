apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: online-shopping
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway-container
          image: online-shopping-gateway:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: gateway.conf

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

      volumes:
        - name: gateway-config
          configMap:
            name: shopping-config
            items:
              - key: gateway.conf
                path: gateway.conf

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: online-shopping
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP